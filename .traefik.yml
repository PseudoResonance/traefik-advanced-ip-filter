displayName: Advanced IP Filter
type: middleware
import: github.com/PseudoResonance/traefik-advanced-ip-filter

summary: IP filter middleware but with increased control over allowing/blocking or use of custom headers.

testData:
  sourceRange:
  - "10.0.0.0/8"
  - "fd00::/8"
  denylist: false
  ipStrategy:
    depth: 2
    header: "X-Forwarded-For"
    isTrustedHeader: "X-Is-Trusted"
    sourceFallback: true
    excludedIPs: []
    ipv6Subnet: 64
