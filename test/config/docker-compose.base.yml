name: "test"

networks:
  net:
    internal: true
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.10

services:
  client:
    image: curlimages/curl:8.20.0
    command: sleep infinity
    stop_signal: SIGKILL
    stop_grace_period: 0s
    depends_on:
      - whoami
      - traefik
    networks:
      net:
        ipv4_address: 192.0.2.64
    volumes:
      - /etc/localtime:/etc/localtime:ro

  whoami:
    image: traefik/whoami:${TRAEFIK_WHOAMI_VERSION:-latest}
    depends_on:
      - traefik
    networks:
      net:
        ipv4_address: 192.0.2.32
    volumes:
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
      - "traefik.http.services.whoami.loadbalancer.server.scheme=http"
      - "traefik.http.services.whoami.loadbalancer.passhostheader=true"

      - "traefik.http.routers.whoami.service=whoami"
      - "traefik.http.routers.whoami.rule=Method(`GET`)"
      - "traefik.http.routers.whoami.entrypoints=web"

      - "traefik.enable=true"

  traefik:
    image: traefik:${TRAEFIK_VERSION:-latest}
    networks:
      net:
        ipv4_address: 192.0.2.128
      default: {}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 1s
      start_period: 1s
      retries: 30
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml
      - ./logs:/var/logs/traefik
      - ./traefik_config:/etc/traefik/mconfig
