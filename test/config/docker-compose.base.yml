name: "test"

networks:
  net:
    internal: true
    enable_ipv4: true
    enable_ipv6: true
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.10
        - subnet: cfff:d518:1358:3724::/64
          gateway: cfff:d518:1358:3724:c2ed:f730:7b6d:7f30

services:
  proxy:
    image: httptoolkit/docker-socks-tunnel:latest
    stop_signal: SIGKILL
    stop_grace_period: 0s
    depends_on:
      - whoami
      - traefik
    ports:
      - name: ingress
        target: 1080
        host_ip: 127.0.0.1
        published: "14694"
        protocol: tcp
        mode: host
    networks:
      net:
        ipv4_address: 192.0.2.64
        ipv6_address: cfff:d518:1358:3724:1e59:ddd8:9586:1acd
      default: {}
    volumes:
      - /etc/localtime:/etc/localtime:ro

  whoami:
    image: traefik/whoami:${TRAEFIK_WHOAMI_VERSION:-latest}
    depends_on:
      - traefik
    networks:
      net:
        ipv4_address: 192.0.2.32
        ipv6_address: cfff:d518:1358:3724:13ac:2226:2ee4:b3f8
    volumes:
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
      - "traefik.http.services.whoami.loadbalancer.server.scheme=http"
      - "traefik.http.services.whoami.loadbalancer.passhostheader=true"

      - "traefik.http.routers.whoami.service=whoami"
      - "traefik.http.routers.whoami.rule=Method(`GET`)"
      - "traefik.http.routers.whoami.entrypoints=web"

      - "traefik.enable=true"

  traefik:
    image: traefik:${TRAEFIK_VERSION:-latest}
    networks:
      net:
        ipv4_address: 192.0.2.128
        ipv6_address: cfff:d518:1358:3724:53fe:bedc:782f:dc4e
      default: {}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 1s
      start_period: 1s
      retries: 30
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml
      - ./logs:/var/logs/traefik
      - ./traefik_config:/etc/traefik/mconfig
